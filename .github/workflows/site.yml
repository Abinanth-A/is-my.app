name: Site

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'domains/**'
      - 'config/**'
      - 'scripts/build-index.mjs'
      - 'tools/wrangler/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # No secrets here: npm install scripts run in this job.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build domain index
        run: node scripts/build-index.mjs
      - name: Build website
        working-directory: web
        run: npm ci && npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  # Has the deploy token, but only runs this repo's scripts and wrangler from tools/wrangler's lockfile.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: website
          path: ${{ runner.temp }}/deploy/site
      - name: Install pinned wrangler
        run: npm ci --prefix tools/wrangler --ignore-scripts --no-audit --no-fund
      - name: Attach is-my.app and www.is-my.app
        run: |
          node scripts/pages-attach.mjs is-my-app is-my.app --comment is-my.app:site
          node scripts/pages-attach.mjs is-my-app www.is-my.app --comment is-my.app:site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare Pages
        working-directory: ${{ runner.temp }}/deploy
        run: >-
          "$GITHUB_WORKSPACE/tools/wrangler/node_modules/.bin/wrangler" pages deploy site
          --project-name is-my-app --branch main --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
