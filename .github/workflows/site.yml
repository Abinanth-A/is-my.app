name: Site

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'domains/**'
      - 'config/**'
      - 'scripts/build-index.mjs'
      - '.github/workflows/site.yml'
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build domain index
        run: node scripts/build-index.mjs
      - name: Build website
        working-directory: web
        run: npm ci && npm run build
      - name: Attach is-my.app and www.is-my.app
        run: |
          node scripts/pages-attach.mjs is-my-app is-my.app --comment is-my.app:site
          node scripts/pages-attach.mjs is-my-app www.is-my.app --comment is-my.app:site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy web/dist --project-name is-my-app --branch main --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
